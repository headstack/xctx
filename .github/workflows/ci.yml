name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.27.1"

jobs:
  lint:
    name: lint:code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout 10m

  test:
    name: test:unit
    runs-on: ubuntu-latest
    env:
      COVER_FILE: xctx
      COVERIGNORE_CONFIG_LOCAL: .coverignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tparse
        run: go install github.com/mfridman/tparse@v0.17.0

      - name: Run tests with coverage
        run: |
          go clean -testcache
          go test --short -coverprofile=${COVER_FILE}.tmp ./... -json | grep -v -f ${COVERIGNORE_CONFIG_LOCAL} | tparse -all
          grep -v -f ${COVERIGNORE_CONFIG_LOCAL} ${COVER_FILE}.tmp > ${COVER_FILE}
          go tool cover -func=${COVER_FILE} | grep ^total

  build:
    name: build:code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o /dev/null ./...
